# Deploy production Hosting on push to main
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    uses: ./.github/workflows/firebase-hosting-reusable.yml
    secrets: inherit
    with:
      channelId: live
